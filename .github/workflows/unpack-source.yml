name: One-time conversion - ZIP to editable sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract current deployed game source
        shell: bash
        run: |
          set -euo pipefail
          test -f chess-pages-source.zip
          unzip -q -o chess-pages-source.zip -d .
          test -f index.html
          test -f src/main.js
          test -f vendor/stockfish-19-single.js
          test -f styles/base.css
          test -f tests/chess.test.js
          node --test tests/*.test.js
      - name: Commit editable game files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src styles assets vendor licenses tests
          for file in package.json THIRD_PARTY_NOTICES.md CHANGELOG.md TEST_REPORT.md; do
            if test -f "$file"; then git add "$file"; fi
          done
          if git diff --cached --quiet; then
            echo 'Editable files are already present.'
            exit 0
          fi
          git commit -m 'Expose editable game source files for GitHub Pages maintenance'
          git push origin HEAD:main
