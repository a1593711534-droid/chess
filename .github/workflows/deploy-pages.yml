name: CHESS ATELIER PRO - Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'styles/**'
      - 'assets/**'
      - 'vendor/**'
      - 'licenses/**'
      - 'tests/**'
      - 'package.json'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test editable game source
        run: npm test
      - name: Assemble static Pages website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R index.html src styles assets vendor licenses THIRD_PARTY_NOTICES.md _site/
          test -f _site/index.html
          test -f _site/src/main.js
          test -f _site/vendor/stockfish-19-single.js
          curl --fail --show-error --silent --location --retry 3 --retry-delay 3 \
            --output _site/vendor/stockfish-19-single.wasm \
            'https://github.com/nmrugg/stockfish.js/releases/download/v19.0.1/stockfish-19-single.wasm'
          echo '991bede2f253ebb08ff01fcc48270f4b9c8e66b12d5bd5f8d6f52eb3e3b3a740  _site/vendor/stockfish-19-single.wasm' | sha256sum --check --status
          test "$(stat -c%s _site/vendor/stockfish-19-single.wasm)" -eq 99169054
          touch _site/.nojekyll
          echo 'Editable source and pinned engine validated.'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
